name: Build Android APK for Gifti

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm ci
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npx cap init Gifti com.aayusolution.gifti --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin Duplicate Classes Resolution
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
              }
          }

          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.9.22"))
          }
          EOF

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare Direct APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Gifti.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gifti-Android-APK
          path: Gifti.apk

      - name: Publish Direct .APK to GitHub Release (No ZIP, 1-Click Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0
          name: "Gifti V3.1.0 - Official Android APK (Direct Download)"
          body: |
            ## 🎁 Gifti V3.1 - Direct Android APK
            
            **Direct Download Link (No ZIP, No Login Needed):**
            👉 **[Download Gifti.apk](https://github.com/AmanYadav9516/Gifti/releases/download/v3.1.0/Gifti.apk)**
            
            ### ✨ Features Included:
            - 🔔 1-Tap Notifications & Floating In-App Chime Toast
            - 📱 Android Phone Hardware Back Button Popstate Support
            - 🫰 2-Way Real-time Typing Disguise & GIFTU Magic Unbox Reveal
            - 📸 10-Photo 3D Flying Air Chat Memories (24h Auto-Clean)
            - 🎴 Holographic Matte VIP Identity Card with Direct Gallery Save
            - 👤 Instagram-style Public Profiles with Bio & Follow System
            - 🎨 Chat Themes, Star Rating Feedback & Alphanumeric ID
          files: Gifti.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
