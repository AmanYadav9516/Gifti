<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2D1145" />
      <stop offset="60%" stop-color="#140A26" />
      <stop offset="100%" stop-color="#080410" />
    </radialGradient>

    <!-- Luxury Gold & Rose Gradient -->
    <linearGradient id="goldRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE27A" />
      <stop offset="45%" stop-color="#FF5E86" />
      <stop offset="80%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#FF4D6D" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)" />
  
  <!-- Outer Ambient Border Ring -->
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#goldRose)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Stylized Letter 'G' with Gift Ribbon & Heart Charm -->
  <g filter="url(#subtleShadow)">
    
    <!-- Outer 'G' Arc -->
    <path
      d="M 330 160 
         C 285 110, 185 110, 140 165
         C 90 225, 90 310, 140 365
         C 195 425, 305 425, 355 365
         C 375 340, 385 305, 385 270
         L 255 270"
      fill="none"
      stroke="url(#goldRose)"
      stroke-width="46"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Center Gift Heart Charm on 'G' -->
    <g transform="translate(285, 270) scale(1.1)">
      <!-- Little Floating Heart inside G -->
      <path
        d="M 0 -12
           C -12 -28, -32 -18, -32 4
           C -32 24, 0 46, 0 46
           C 0 46, 32 24, 32 4
           C 32 -18, 12 -28, 0 -12 Z"
        fill="url(#goldRose)"
        filter="url(#glow)"
      />
    </g>

    <!-- Top Sparkle Star -->
    <path
      d="M 380 120 Q 380 145 405 145 Q 380 145 380 170 Q 380 145 355 145 Q 380 145 380 120 Z"
      fill="#FFE27A"
      filter="url(#glow)"
    />

    <!-- Small Sparkle Star -->
    <path
      d="M 130 380 Q 130 395 145 395 Q 130 395 130 410 Q 130 395 115 395 Q 130 395 130 380 Z"
      fill="#FF85A1"
      opacity="0.8"
    />
  </g>
</svg>
